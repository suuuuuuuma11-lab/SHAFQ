<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ClothStore — لوحة تحكم إدارة المنتجات">
  <title>ClothStore | إدارة المنتجات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="auth-loading">

  <!-- ====== Header ====== -->
  <header class="admin-header">
    <div class="header-inner">
      <!-- Right: Brand Logo & Title -->
      <div class="header-brand">
        <a class="brand-link" href="../frontend/index.html" title="الرجوع للمتجر">
          <!-- Hanger Icon -->
          <svg class="brand-hanger-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 16 C32 10 38 8 38 14 C38 18 32 20 32 26" />
            <path d="M32 26 L10 42 C8 43.5 9 46 11.5 46 L52.5 46 C55 46 56 43.5 54 42 Z" />
          </svg>
          <div class="brand-text">
            <span class="brand-name">ClothStore</span>
            <span class="brand-sub">إدارة المنتجات</span>
          </div>
        </a>
      </div>

      <!-- Left: User Profile Pill -->
      <div class="header-user">
        <div class="user-pill">
          <div class="user-avatar-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <span class="user-name" id="adminUserEmail">Admin</span>
          <button type="button" class="logout-btn" id="logoutBtn" title="تسجيل الخروج" aria-label="تسجيل الخروج">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>خروج</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ====== Main Dashboard Content ====== -->
  <main class="admin-main">
    
    <!-- Top Action Bar (Title + Search + Add Button) -->
    <div class="top-action-bar">
      <!-- Right: Title & Search Input -->
      <div class="action-bar-right">
        <h1 class="page-title">المنتجات</h1>
        <div class="search-box-wrap">
          <input 
            type="search" 
            class="search-input" 
            id="searchInput" 
            placeholder="ابحث عن منتج..." 
            autocomplete="off"
            aria-label="ابحث عن منتج"
          >
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <button class="search-clear-btn" type="button" id="searchClear" hidden aria-label="مسح البحث">×</button>
        </div>
      </div>

      <!-- Left: Add Product Button -->
      <div class="action-bar-left">
        <button class="btn btn-primary add-product-btn" type="button" id="openAddModalBtn">
          <span class="plus-sign">+</span>
          <span>إضافة منتج</span>
        </button>
      </div>
    </div>

    <!-- Products Table Card -->
    <section class="products-card" id="productsCard">
      <div class="products-wrapper" id="productsContainer">
        <!-- Injected via admin.js -->
      </div>
      <!-- Pagination Footer -->
      <div class="pagination-footer" id="paginationContainer">
        <!-- Injected via admin.js -->
      </div>
    </section>

  </main>

  <!-- ====== Product Form Modal (Shared for Add & Edit) ====== -->
  <div class="modal-overlay" id="productFormModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
    <div class="product-modal-panel">
      <!-- Modal Header -->
      <div class="modal-header-row">
        <h2 class="modal-heading" id="formModalTitle">إضافة منتج</h2>
        <button class="modal-close-icon-btn" type="button" id="closeFormModalBtn" aria-label="إغلاق">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Modal Body / Form -->
      <form class="product-form" id="productForm" novalidate>
        <div class="form-split-layout">
          
          <!-- Inputs Side (Right in RTL) -->
          <div class="form-inputs-side">
            <div class="form-fields-grid">
              
              <!-- Row 1: اسم المنتج + التصنيف -->
              <div class="form-field-group" id="fieldNameGroup">
                <label for="productName">اسم المنتج</label>
                <input 
                  type="text" 
                  id="productName" 
                  name="name" 
                  placeholder="أدخل اسم المنتج" 
                  autocomplete="off"
                >
                <span class="field-error-msg" id="nameError"></span>
              </div>

              <div class="form-field-group" id="fieldCategoryGroup">
                <label for="productCategory">التصنيف</label>
                <div class="category-select-control-row">
                  <div class="select-wrapper category-select-wrap">
                    <select id="productCategory" name="categoryId">
                      <option value="">اختر التصنيف</option>
                    </select>
                    <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                      <path d="M6 9l6 6 6-6"/>
                    </svg>
                  </div>
                  <button type="button" class="btn-create-category" id="openAddCategoryModalBtn" title="إضافة تصنيف جديد">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                      <line x1="12" y1="5" x2="12" y2="19"/>
                      <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span>إضافة تصنيف</span>
                  </button>
                </div>
                <span class="field-error-msg" id="categoryError"></span>
              </div>

              <!-- Row 2: السعر + العنوان -->
              <div class="form-field-group" id="fieldPriceGroup">
                <label for="productPrice">السعر</label>
                <div class="currency-input-wrap">
                  <span class="currency-prefix">دج</span>
                  <input 
                    type="number" 
                    id="productPrice" 
                    name="price" 
                    placeholder="أدخل السعر" 
                    min="0"
                    autocomplete="off"
                  >
                </div>
                <span class="field-error-msg" id="priceError"></span>
              </div>

              <div class="form-field-group" id="fieldTitleGroup">
                <label for="productTitle">العنوان</label>
                <input 
                  type="text" 
                  id="productTitle" 
                  name="title" 
                  placeholder="أدخل عنوان المنتج" 
                  autocomplete="off"
                >
                <span class="field-error-msg" id="titleError"></span>
              </div>

              <!-- Row 3: الوصف -->
              <div class="form-field-group field-desc-group" id="fieldDescGroup">
                <label for="productDescription">الوصف</label>
                <textarea 
                  id="productDescription" 
                  name="description" 
                  placeholder="أدخل وصف المنتج هنا..." 
                  rows="3"
                ></textarea>
              </div>

              <!-- Row 4: الأحجام (اختياري) -->
              <div class="form-field-group full-width-field" id="fieldSizesGroup">
                <div class="options-toggle-header">
                  <label class="options-toggle-title">الأحجام (المقاسات)</label>
                  <div class="toggle-segmented-control" role="radiogroup" aria-label="تحديد توفر الأحجام">
                    <label class="segmented-opt">
                      <input type="radio" name="hasSizesToggle" value="no" id="hasSizesNo" checked>
                      <span>لا يوجد أحجام</span>
                    </label>
                    <label class="segmented-opt">
                      <input type="radio" name="hasSizesToggle" value="yes" id="hasSizesYes">
                      <span>يوجد أحجام</span>
                    </label>
                  </div>
                </div>

                <!-- Sizes Config Box -->
                <div class="options-expandable-box" id="sizesConfigBox" hidden>
                  <div class="chips-editor-container">
                    <div class="chips-list" id="sizesChipsList">
                      <!-- Dynamically rendered size chips -->
                    </div>
                    <div class="chip-add-inline">
                      <input type="text" id="newSizeInput" placeholder="أدخل حجماً (مثال: XL, 42)..." maxlength="15" autocomplete="off">
                      <button type="button" class="btn-sub-action" id="addSizeBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        <span>إضافة حجم</span>
                      </button>
                    </div>
                  </div>

                  <div class="quick-preset-bar">
                    <span class="preset-label">مقترحات سريعة:</span>
                    <div class="preset-chips" id="sizePresetsList">
                      <button type="button" class="preset-chip" data-val="XS">XS</button>
                      <button type="button" class="preset-chip" data-val="S">S</button>
                      <button type="button" class="preset-chip" data-val="M">M</button>
                      <button type="button" class="preset-chip" data-val="L">L</button>
                      <button type="button" class="preset-chip" data-val="XL">XL</button>
                      <button type="button" class="preset-chip" data-val="XXL">XXL</button>
                      <button type="button" class="preset-chip" data-val="38">38</button>
                      <button type="button" class="preset-chip" data-val="39">39</button>
                      <button type="button" class="preset-chip" data-val="40">40</button>
                      <button type="button" class="preset-chip" data-val="41">41</button>
                      <button type="button" class="preset-chip" data-val="42">42</button>
                      <button type="button" class="preset-chip" data-val="43">43</button>
                      <button type="button" class="preset-chip" data-val="44">44</button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Row 5: الألوان (اختياري) -->
              <div class="form-field-group full-width-field" id="fieldColorsGroup">
                <div class="options-toggle-header">
                  <label class="options-toggle-title">الألوان</label>
                  <div class="toggle-segmented-control" role="radiogroup" aria-label="تحديد توفر الألوان">
                    <label class="segmented-opt">
                      <input type="radio" name="hasColorsToggle" value="no" id="hasColorsNo" checked>
                      <span>لا يوجد ألوان</span>
                    </label>
                    <label class="segmented-opt">
                      <input type="radio" name="hasColorsToggle" value="yes" id="hasColorsYes">
                      <span>يوجد ألوان</span>
                    </label>
                  </div>
                </div>

                <!-- Colors Config Box -->
                <div class="options-expandable-box" id="colorsConfigBox" hidden>
                  <div class="colors-list-grid" id="colorsListGrid">
                    <!-- Dynamically rendered color rows -->
                  </div>

                  <div class="color-add-bar">
                    <button type="button" class="btn-sub-action" id="addColorBtn">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                      <span>إضافة لون جديد</span>
                    </button>
                  </div>

                  <div class="quick-preset-bar">
                    <span class="preset-label">ألوان شائعة:</span>
                    <div class="preset-chips" id="colorPresetsList">
                      <button type="button" class="color-preset-chip" data-name="أسود" data-val="#111111"><span class="swatch-dot" style="background:#111111"></span> أسود</button>
                      <button type="button" class="color-preset-chip" data-name="أبيض" data-val="#FFFFFF"><span class="swatch-dot" style="background:#FFFFFF; border:1px solid #cbd5e1"></span> أبيض</button>
                      <button type="button" class="color-preset-chip" data-name="رمادي" data-val="#64748B"><span class="swatch-dot" style="background:#64748B"></span> رمادي</button>
                      <button type="button" class="color-preset-chip" data-name="كحلي" data-val="#1E3A8A"><span class="swatch-dot" style="background:#1E3A8A"></span> كحلي</button>
                      <button type="button" class="color-preset-chip" data-name="أزرق" data-val="#2563EB"><span class="swatch-dot" style="background:#2563EB"></span> أزرق</button>
                      <button type="button" class="color-preset-chip" data-name="أخضر" data-val="#15803D"><span class="swatch-dot" style="background:#15803D"></span> أخضر</button>
                      <button type="button" class="color-preset-chip" data-name="أحمر" data-val="#DC2626"><span class="swatch-dot" style="background:#DC2626"></span> أحمر</button>
                      <button type="button" class="color-preset-chip" data-name="بيج" data-val="#E7D8C9"><span class="swatch-dot" style="background:#E7D8C9"></span> بيج</button>
                      <button type="button" class="color-preset-chip" data-name="بني" data-val="#78350F"><span class="swatch-dot" style="background:#78350F"></span> بني</button>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <!-- Image Upload & Action Side (Left in RTL) -->
          <div class="form-upload-side">
            <!-- Dashed Upload Dropzone -->
            <div class="upload-dropzone" id="dropzone" role="button" tabindex="0" aria-label="اختيار صورة المنتج">
              <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <span class="upload-title">اختر صورة المنتج</span>
              <span class="upload-sub">أو اسحب الصورة هنا</span>
              <input type="file" id="imageInput" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple hidden>
            </div>
            <span class="field-error-msg text-center" id="imagesError"></span>

            <!-- Thumbnails Strip -->
            <div class="thumbnails-container">
              <div class="thumbnails-grid" id="imagesGrid">
                <!-- Injected thumbnails via admin.js -->
              </div>
              <button class="add-thumb-box" type="button" id="addThumbBtn" title="إضافة صورة أخرى" aria-label="إضافة صورة">
                +
              </button>
            </div>

            <!-- Modal Action Buttons (Save & Cancel) -->
            <div class="form-actions-wrap">
              <button class="btn btn-primary btn-save-product" type="submit" id="saveProductBtn">
                <span class="btn-text" id="saveBtnText">حفظ المنتج</span>
                <span class="btn-loader" id="saveBtnLoader" hidden>جاري الحفظ...</span>
              </button>
              <button class="btn btn-secondary btn-cancel-product" type="button" id="cancelFormBtn">
                إلغاء
              </button>
            </div>
          </div>

        </div>
      </form>
    </div>
  </div>

  <!-- ====== Add Category Modal (Inside Product Form Workflow) ====== -->
  <div class="modal-overlay nested-modal-overlay" id="addCategoryModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="addCategoryModalTitle">
    <div class="category-modal-panel">
      <!-- Modal Header -->
      <div class="category-modal-header">
        <div class="category-modal-header-text">
          <h3 class="category-modal-title" id="addCategoryModalTitle">إضافة تصنيف جديد</h3>
          <p class="category-modal-subtitle">أدخل اسم التصنيف لحفظه وتحديده في نموذج المنتج فوراً.</p>
        </div>
        <button class="modal-close-icon-btn" type="button" id="closeCategoryModalBtn" aria-label="إغلاق">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Category Form -->
      <form class="category-form" id="categoryForm" novalidate>
        <div class="form-field-group" id="categoryNameFieldGroup">
          <label for="newCategoryName">اسم التصنيف <span class="required-star">*</span></label>
          <input 
            type="text" 
            id="newCategoryName" 
            name="name" 
            placeholder="مثال: فساتين، معاطف، أحذية..." 
            autocomplete="off"
            required
          >
          <span class="field-error-msg" id="newCategoryNameError"></span>
        </div>

        <div class="category-modal-actions">
          <button class="btn btn-secondary" type="button" id="cancelCategoryModalBtn">
            إلغاء
          </button>
          <button class="btn btn-primary" type="submit" id="saveCategoryBtn">
            <span class="btn-text" id="saveCategoryBtnText">إنشاء التصنيف</span>
            <span class="btn-loader" id="saveCategoryBtnLoader" hidden>جاري الإنشاء...</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ====== Delete Confirmation Modal ====== -->
  <div class="modal-overlay" id="deleteModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
    <div class="delete-modal-panel">
      <!-- Top Close Button -->
      <button class="modal-close-icon-btn" type="button" id="closeDeleteModalBtn" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <!-- Circular Red Icon Badge -->
      <div class="delete-icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/>
          <line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
      </div>

      <h3 class="delete-modal-title" id="deleteModalTitle">هل أنت متأكد؟</h3>
      <p class="delete-modal-desc">هل أنت متأكد أنك تريد حذف هذا المنتج؟</p>
      <p class="delete-modal-item-name" id="deleteProductName"></p>

      <div class="delete-modal-actions">
        <button class="btn btn-danger delete-confirm-btn" type="button" id="confirmDeleteBtn">
          <span class="btn-text" id="deleteBtnText">حذف</span>
          <span class="btn-loader" id="deleteBtnLoader" hidden>جاري الحذف...</span>
        </button>
        <button class="btn btn-secondary delete-cancel-btn" type="button" id="cancelDeleteBtn">
          إلغاء
        </button>
      </div>
    </div>
  </div>

  <!-- ====== Image Lightbox ====== -->
  <div class="lightbox" id="imageLightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" id="closeLightbox" aria-label="إغلاق المعاينة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <img id="lightboxImage" src="" alt="معاينة الصورة">
  </div>

  <!-- ====== Toast Container ====== -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- ====== Scripts ====== -->
  <script type="module" src="admin.js"></script>
</body>
</html>
