<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SHAFQ — Before the lights fade.</title>
  <meta name="description" content="SHAFQ — More than what you wear. Free delivery across Algeria.">
  <meta name="theme-color" content="#14120f">
  <script>
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var v = (p.get("view") || "").trim().toLowerCase();
        if (p.get("cat") || p.get("category") || p.get("q") || p.get("search") || v === "sale" || v === "discounts" || v === "fav" || v === "favorites") {
          location.replace("/shop" + location.search);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="assets/images/hero-1.jpg" as="image">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-home">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-truck" viewBox="0 0 24 16">
        <path d="M1.2 1.6h12.2v10.3H1.2z" />
        <path d="M13.4 4.6h4.3l3.9 3.8v3.5h-8.2" />
        <circle cx="5.6" cy="12.6" r="2.1" class="knock" />
        <circle cx="17" cy="12.6" r="2.1" class="knock" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.6" />
        <path d="M15.4 15.4 21 21" />
      </symbol>

      <symbol id="i-bag" viewBox="0 0 24 24">
        <path d="M4.6 8.2h14.8l.4 12.3H4.2z" />
        <path d="M8.6 8.2V6.4a3.4 3.4 0 0 1 6.8 0v1.8" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 28 16">
        <path d="M1 8h25M19.5 1.5 26 8l-6.5 6.5" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M5 5l14 14M19 5 5 19" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M3.5 7.5h17M3.5 12h17M3.5 16.5h17" />
      </symbol>
    </defs>
  </svg>

  <main class="hero" id="home">
    <div class="hero__bg" aria-hidden="true">
      <img src="assets/images/hero-1.jpg" alt="" class="hero__img" decoding="async" fetchpriority="high">
    </div>
    <div class="hero__shade" aria-hidden="true"></div>

    <!-- Announcement / utility bar -->
    <div class="topbar">
      <p class="topbar__note">
        <svg class="ico ico--truck" aria-hidden="true">
          <use href="#i-truck" />
        </svg>
        <span>Free delivery across Algeria</span>
      </p>
      <div class="topbar__tools">
        <button type="button" class="tool" id="btn-search" aria-label="Search" aria-expanded="false"><svg class="ico">
            <use href="#i-search" />
          </svg></button>

        <button type="button" class="tool" id="btn-cart" aria-label="Bag"><svg class="ico">
            <use href="#i-bag" />
          </svg><span class="tool__count" id="cart-count" hidden>0</span></button>
      </div>
    </div>

    <!-- Brand + navigation -->
    <header class="header">
      <a class="brand" href="/" aria-label="SHAFQ — شفق"><img src="assets/images/logo-shafq.png"
          alt="شفق — Before the lights fade" width="570" height="256"></a>
      <button type="button" class="burger" id="btn-menu" aria-label="Menu" aria-expanded="false" aria-controls="nav"><svg class="ico">
          <use href="#i-menu" />
        </svg></button>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="/" class="nav__link is-active" aria-current="page">Home</a>
        <a href="/shop" class="nav__link">Shop</a>
        <a href="/about" class="nav__link">About</a>
        <a href="/contact" class="nav__link">Contact</a>
      </nav>
    </header>

    <!-- Headline block -->
    <div class="hero__content">
      <h1 class="hero__title"><span>Before</span><span>the lights fade.</span>
      </h1>
      <p class="hero__sub">More than what you wear.</p>
      <a class="cta" href="/shop">
        <span>Discover the Collection</span>
        <svg class="ico ico--arrow" aria-hidden="true">
          <use href="#i-arrow" />
        </svg>
      </a>
    </div>

    <!-- Sun emblem -->
    <div class="emblem" aria-hidden="true">
      <svg viewBox="190 100 470 360" class="emblem__sun" id="emblem-sun"></svg>
      <span class="emblem__word">SHAFQ</span>
    </div>

  </main>

  <!-- Newsletter Banner -->
  <section class="newsletter" id="newsletter" aria-label="Newsletter">
    <div class="newsletter__bg" aria-hidden="true">
      <img src="assets/images/newsletter-bg.jpg" alt="" class="newsletter__img" loading="lazy" decoding="async">
    </div>
    <div class="newsletter__shade" aria-hidden="true"></div>
    <div class="newsletter__inner">
      <div class="newsletter__visual" aria-hidden="true"></div>
      <div class="newsletter__brand">
        <img src="assets/images/logo-shafq.png" alt="شفق — Before the lights fade" class="newsletter__logo" width="570" height="256">
      </div>
      <div class="newsletter__content">
        <h2 class="newsletter__title">Stay in the loop</h2>
        <p class="newsletter__desc">Be the first to know about new collections and exclusive drops.</p>
        <form class="newsletter__form" id="newsletter-form">
          <input type="email" class="newsletter__input" placeholder="Your email address" required autocomplete="email" aria-label="Email address">
          <button type="submit" class="newsletter__btn" aria-label="Subscribe">
            <svg class="ico ico--arrow" aria-hidden="true"><use href="#i-arrow"/></svg>
          </button>
        </form>
        <p class="newsletter__status" id="newsletter-status" aria-live="polite" hidden></p>
      </div>
    </div>
  </section>

  <!-- Search overlay -->
  <div class="sheet sheet--search" id="sheet-search" hidden>
    <form class="search" id="search-form" role="search">
      <svg class="ico" aria-hidden="true">
        <use href="#i-search" />
      </svg>
      <input type="search" id="search-input" placeholder="Search the collection" autocomplete="off" aria-label="Search">
      <button type="button" class="tool" data-close aria-label="Close"><svg class="ico">
          <use href="#i-close" />
        </svg></button>
    </form>
    <p class="search__result" id="search-result" aria-live="polite"></p>
  </div>

  <!-- Bag drawer -->
  <aside class="drawer" id="drawer-cart" aria-hidden="true" aria-label="Bag" hidden>
    <div class="drawer__head">
      <h2>Bag</h2>
      <button type="button" class="tool" data-close aria-label="Close"><svg class="ico">
          <use href="#i-close" />
        </svg></button>
    </div>
    <div class="drawer__body" id="drawer-cart-body">
      <p class="drawer__empty">Your bag is empty.</p>
    </div>
    <div class="drawer__foot" id="drawer-cart-foot" hidden>
      <div class="drawer__total">
        <span>Subtotal</span>
        <strong id="drawer-cart-total">0 DA</strong>
      </div>
      <button type="button" class="drawer__checkout" id="drawer-checkout-btn">Proceed to Checkout</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <script src="js/main.js"></script>
  <script src="js/transitions.js"></script>
  <script type="module" src="js/search.js"></script>
  <script type="module" src="js/cart.js"></script>
</body>

</html>
